<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <!-- 登入前畫面 -->
    <div id="auth-section" class="bg-white p-8 rounded-xl shadow-md w-96 text-center">
        <h1 class="text-2xl font-bold mb-4">會員登入</h1>
        <input type="email" id="email" placeholder="電子郵件" class="w-full p-2 mb-3 border rounded"><br>
        <input type="password" id="password" placeholder="密碼" class="w-full p-2 mb-3 border rounded"><br>
        <button onclick="login()" class="w-full bg-blue-500 text-white p-2 rounded mb-2 hover:bg-blue-600">登入</button>
        <button onclick="signup()" class="w-full bg-gray-300 text-gray-700 p-2 rounded hover:bg-gray-400">註冊</button>
    </div>

    <!-- 登入後空白頁面 -->
    <div id="dashboard-section" class="hidden fixed inset-0 bg-white p-6">
        <!-- 右上角登出按鈕 -->
        <div class="flex justify-between items-center pb-4 border-b">
            <span id="user-email" class="text-gray-500 text-sm"></span>
            <button onclick="logout()" class="bg-red-500 text-white px-4 py-1.5 rounded text-sm hover:bg-red-600">登出</button>
        </div>
        
        <!-- 空白主要區域（未來可以在這裡放置你想要的功能與內容） -->
        <main class="h-full">
            
        </main>
    </div>

    <script>
        // Supabase 設定
        const SUPABASE_URL = 'https://lureabzpvkiekoruawak.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LqVsGMmyTAwpeM1-OKb5Kw_oRGOwPbC';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 檢查登入狀態
        async function checkUser() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                document.getElementById('user-email').innerText = `已登入：${session.user.email}`;
            } else {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('dashboard-section').classList.add('hidden');
            }
        }

        async function signup() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabase.auth.signUp({ email, password });
            if (error) alert(error.message);
            else alert('註冊成功！請直接登入');
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) alert(error.message);
            else checkUser();
        }

        async function logout() {
            await supabase.auth.signOut();
            checkUser();
        }

        checkUser();
    </script>
</body>
</html>
