<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員系統除錯版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <!-- 登入前畫面 -->
    <div id="auth-section" class="bg-white p-8 rounded-xl shadow-md w-96 text-center">
        <h1 class="text-2xl font-bold mb-4">會員登入 (除錯版)</h1>
        <input type="text" id="username" placeholder="請輸入帳號" class="w-full p-2 mb-3 border rounded"><br>
        <input type="password" id="password" placeholder="密碼" class="w-full p-2 mb-3 border rounded"><br>
        <button id="login-btn" class="w-full bg-blue-500 text-white p-2 rounded mb-2 hover:bg-blue-600 cursor-pointer">登入</button>
        <button id="signup-btn" class="w-full bg-gray-300 text-gray-700 p-2 rounded hover:bg-gray-400 cursor-pointer">註冊</button>
    </div>

    <!-- 登入後空白頁面 -->
    <div id="dashboard-section" class="hidden fixed inset-0 bg-white p-6">
        <div class="flex justify-between items-center pb-4 border-b">
            <span id="user-email" class="text-gray-500 text-sm"></span>
            <button id="logout-btn" class="bg-red-500 text-white px-4 py-1.5 rounded text-sm hover:bg-red-600 cursor-pointer">登出</button>
        </div>
        <main class="h-full flex items-center justify-center">
            <h2 class="text-xl text-gray-400">登入成功！這是空白頁面</h2>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://lureabzpvkiekoruawak.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LqVsGMmyTAwpeM1-OKb5Kw_oRGOwPbC';
        
        let supabase;
        try {
            supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
            alert('Supabase 初始化失敗: ' + e.message);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('login-btn');
            const signupBtn = document.getElementById('signup-btn');
            const logoutBtn = document.getElementById('logout-btn');

            async function checkUser() {
                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (session) {
                        document.getElementById('auth-section').classList.add('hidden');
                        document.getElementById('dashboard-section').classList.remove('hidden');
                        document.getElementById('user-email').innerText = `已登入：${session.user.email.split('@')[0]}`;
                    } else {
                        document.getElementById('auth-section').classList.remove('hidden');
                        document.getElementById('dashboard-section').classList.add('hidden');
                    }
                } catch (e) {
                    console.error(e);
                }
            }

            loginBtn.addEventListener('click', async () => {
                const rawName = usernameInput.value.trim();
                const password = passwordInput.value.trim();
                
                if (!rawName || !password) {
                    alert('請輸入帳號和密碼！');
                    return;
                }

                const email = rawName + '@mathlearn.com';
                alert('準備登入帳號: ' + email); // 測試點擊有沒有反應

                try {
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) {
                        alert('登入失敗回傳: ' + error.message);
                    } else {
                        alert('登入成功！');
                        checkUser();
                    }
                } catch (err) {
                    alert('發生嚴重錯誤: ' + err.message);
                }
            });

            logoutBtn.addEventListener('click', async () => {
                await supabase.auth.signOut();
                checkUser();
            });

            checkUser();
        });
    </script>
</body>
</html>
