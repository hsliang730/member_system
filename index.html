<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員系統測試</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div id="auth-section" class="bg-white p-8 rounded-xl shadow-md w-96 text-center">
        <h1 class="text-2xl font-bold mb-4">會員登入</h1>
        <input type="email" id="email" placeholder="電子郵件 (例如: admin@test.com)" class="w-full p-2 mb-3 border rounded"><br>
        <input type="password" id="password" placeholder="密碼" class="w-full p-2 mb-3 border rounded"><br>
        <button id="login-btn" class="w-full bg-blue-500 text-white p-2 rounded mb-2 hover:bg-blue-600">登入</button>
        <button id="signup-btn" class="w-full bg-gray-300 text-gray-700 p-2 rounded hover:bg-gray-400">註冊</button>
    </div>

    <div id="dashboard-section" class="hidden fixed inset-0 bg-white p-6">
        <div class="flex justify-between items-center pb-4 border-b">
            <span id="user-email" class="text-gray-500 text-sm"></span>
            <button id="logout-btn" class="bg-red-500 text-white px-4 py-1.5 rounded text-sm hover:bg-red-600">登出</button>
        </div>
        <main class="h-full flex items-center justify-center">
            <h2 class="text-xl text-gray-400">登入成功！這是空白頁面</h2>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://lureabzpvkiekoruawak.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LqVsGMmyTAwpeM1-OKb5Kw_oRGOwPbC';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkUser() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                document.getElementById('user-email').innerText = `已登入：${session.user.email}`;
            } else {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('dashboard-section').classList.add('hidden');
            }
        }

        // 綁定按鈕事件
        document.getElementById('signup-btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabase.auth.signUp({ email, password });
            if (error) alert(error.message);
            else alert('註冊成功！請直接點擊登入');
        });

        document.getElementById('login-btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert('登入失敗: ' + error.message);
            } else {
                checkUser();
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            checkUser();
        });

        checkUser();
    </script>
</body>
</html>
